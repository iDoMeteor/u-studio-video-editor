name: CI

# Parked: every run since this workflow's own introduction has failed on
# CI-environment gaps, not real regressions (confirmed against the same
# commits building and testing clean locally every time) -- the fedora:44
# container has no real audio device (sdl2_audio/JACK/PulseAudio all fail
# to open), and at least test_probe_media, test_thumbnail_cache, and
# test_render/test_playback_controller hit further container-specific
# codec/signal-handling differences. Manual dispatch only until the
# container gets a working virtual audio sink (or the tests that need
# real playback are skipped there) and this is verified green -- do not
# re-add `push`/`pull_request` triggers without the owner's explicit
# sign-off (CLAUDE.md's "What the agent should NOT do").
on:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      # git must be present before actions/checkout runs, or checkout falls
      # back to downloading a tarball via the GitHub REST API instead of a
      # real git clone -- no .git directory results, silently, and anything
      # later that runs `git` (the format job, notably) breaks.
      - name: Install git
        run: dnf install -y git
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          dnf install -y gcc-c++ meson ninja-build gtk4-devel libadwaita-devel \
            mlt-devel libxml2-devel pulseaudio-libs-devel xorg-x11-server-Xvfb
      - name: Configure
        run: meson setup builddir -Dwerror=true -Dbuildtype=debugoptimized
      - name: Build
        run: meson compile -C builddir
      - name: Test
        run: xvfb-run -a meson test -C builddir --print-errorlogs

  # Called out as its own job (in addition to being exercised inside
  # build-test's test suite) so a Qt regression fails loudly and
  # specifically, per docs/plans/v2/11-build-test-ci-packaging.md.
  no-qt-policy:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install git
        run: dnf install -y git
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          dnf install -y gcc-c++ meson ninja-build gtk4-devel libadwaita-devel \
            mlt-devel libxml2-devel pulseaudio-libs-devel
      - name: Configure
        run: meson setup builddir -Dbuildtype=debugoptimized
      - name: Build the factory-policy test
        run: meson compile -C builddir tests/engine/test_factory_policy
      - name: Run the factory-policy test
        run: ./builddir/tests/engine/test_factory_policy

  format:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install git
        run: dnf install -y git
      - uses: actions/checkout@v4
      - name: Install clang-tools-extra
        run: dnf install -y clang-tools-extra
      - name: Check formatting
        # Excludes subprojects/ (vendored doctest.h, ADR-010) -- third-party
        # code isn't ours to reformat or hold to this style.
        run: clang-format --dry-run --Werror $(git ls-files '*.cpp' '*.h' ':(exclude)subprojects/*')
