# The titles drop-in as a Flatpak extension (ADR-014, doc 17): an opt-in
# add-on to com.ustudio.VideoEditor, mounted at
# /app/lib/u-studio/extensions/Titles through the app's
# com.ustudio.VideoEditor.DropIn extension point.
#
# Build it with `just flatpak-titles` after `just flatpak`: it builds against
# the app, which must be installed in the installation flatpak-builder uses,
# at the same version. The editor refuses a drop-in built for another
# release, so the app and this extension ship as a pair.
#
# What it carries, all under its own prefix:
#   lib/u-studio/drop-ins/libustudio-dropin-titles.so  the editor's side (the
#       loader scans each extension's lib/u-studio/drop-ins/)
#   lib/u-studio/mlt/libmltustudio.so  the ustudio_title MLT producer, found
#       by the drop-in at its install path
#   bin/u-studio-titles  the designer, launched by the editor's New Title /
#       Edit Title (found in the drop-in's own bindir)
#   share/u-studio/titles/templates  the built-in templates, beside bin/,
#       where the designer looks for them (from 0.66)
# The brand kit is compiled into the designer (GResource).
#
# The designer's desktop entry, MIME type and AppStream file are left out:
# an extension can't export them, so the designer is reached from the
# editor only.

id: com.ustudio.VideoEditor.DropIn.Titles
runtime: com.ustudio.VideoEditor
runtime-version: master
sdk: org.gnome.Sdk//51
build-extension: true
separate-locales: false
appstream-compose: false
build-options:
  prefix: /app/lib/u-studio/extensions/Titles
  prepend-pkg-config-path: /app/lib/u-studio/extensions/Titles/lib/pkgconfig

modules:
  # MLT's headers and libraries to compile and link against: the app's
  # manifest cleans /include and the .pc files out of /app. Only the
  # framework and mlt++ (the core module has no dependencies; every other
  # one is off). Same release as modules/mlt.yml, so the sonames resolve to
  # the app's MLT at run time; removed from the extension after the build.
  - name: mlt-headers
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
      - -DBUILD_TESTS_WITH_QT6=OFF
      - -DBUILD_DOCS=OFF
      - -DCLANG_FORMAT=OFF
      - -DMOD_AVFORMAT=OFF
      - -DMOD_DECKLINK=OFF
      - -DMOD_FREI0R=OFF
      - -DMOD_GDK=OFF
      - -DMOD_GLAXNIMATE_QT6=OFF
      - -DMOD_JACKRACK=OFF
      - -DUSE_LV2=OFF
      - -DUSE_VST2=OFF
      - -DMOD_KDENLIVE=OFF
      - -DMOD_MOVIT=OFF
      - -DMOD_NDI=OFF
      - -DMOD_NORMALIZE=OFF
      - -DMOD_OLDFILM=OFF
      - -DMOD_OPENCV=OFF
      - -DMOD_OPENFX=OFF
      - -DMOD_PLUS=OFF
      - -DMOD_PLUSGPL=OFF
      - -DMOD_QT6=OFF
      - -DMOD_RESAMPLE=OFF
      - -DMOD_RTAUDIO=OFF
      - -DMOD_RUBBERBAND=OFF
      - -DMOD_RNNOISE=OFF
      - -DMOD_SDL1=OFF
      - -DMOD_SDL2=OFF
      - -DMOD_SOX=OFF
      - -DMOD_SPATIALAUDIO=OFF
      - -DMOD_VIDSTAB=OFF
      - -DMOD_VORBIS=OFF
      - -DMOD_XINE=OFF
      - -DMOD_XML=OFF
    sources:
      - type: archive
        url: https://github.com/mltframework/mlt/releases/download/v7.40.0/mlt-7.40.0.tar.gz
        sha256: f11c30e21670f62a3dfc56a31306ac02f3feea00908a2821a4a0bf3e989d3d6a

  # The whole project configures and builds (the drop-in compiles against
  # src/); only the titles files are kept (cleanup below).
  - name: u-studio-titles
    buildsystem: meson
    config-opts:
      - -Dbuildtype=release
      - -Dtests=disabled
      - -Drender_tool=false
      - -Ddropin_titles=module
      # u-studio-share needs the network, which the editor's sandbox (and
      # so this extension) doesn't have. It ships as its own app, if at
      # all, and without it the designer hides Browse Shared and Publish.
      - -Dtitles_share=disabled
    sources:
      - type: dir
        path: ../..
        skip:
          - builddir
          - build-flatpak
          - .flatpak-builder
          - .claude
    # The editor's own files and the designer's desktop integration go;
    # share/u-studio/titles/ (the built-in templates, from 0.66) stays.
    cleanup:
      - /bin/u-studio-video-editor
      - /share/applications
      - /share/glib-2.0
      - /share/icons
      - /share/metainfo
      - /share/mime

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /lib/libmlt*
  - /lib/mlt-7
  - /bin/melt*
  - /share/mlt-7
  - /share/man
  - /share/doc
  - '*.a'
  - '*.la'
