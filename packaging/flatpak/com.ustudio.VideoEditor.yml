# Flatpak manifest for u Studio Video Editor (doc 11, "Packaging").
#
# Build the single-file bundle from the repo root with `just flatpak`.
#
# Why build MLT and FFmpeg here instead of taking them from the runtime:
# - The engine relies on MLT 7.40 behaviour (README engine notes); distros
#   such as Ubuntu 24.04 / Mint 22 ship 7.22.
# - H.264 export needs libx264, which no Flathub runtime or extension
#   carries. Linking it makes FFmpeg, and so this bundle, GPL; the app is
#   MIT (compatible), but the bundle as a whole is GPL. Licence files land in
#   /app/share/licenses.
#
# No Qt (ADR-007) is structural here: only the MLT modules listed under
# "mlt" are built, and the qt6/glaxnimate ones are switched off explicitly.
# FactoryPolicy's curated module directory still runs on top.
#
# There is deliberately no --share=network: the editor makes no network
# requests (CLAUDE.md, "Security & data safety").

id: com.ustudio.VideoEditor
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: u-studio-video-editor

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  # An editor opens footage from wherever it lives: home, removable
  # drives and extra mounts. Direct paths keep projects portable between
  # the Flatpak and a distro build (no /run/user/.../doc/ paths saved).
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/run/media
  - --filesystem=/mnt

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/pkgconfig
  - /share/man
  - /share/doc
  - '*.a'
  - '*.la'

modules:
  # x264: the H.264 encoder behind High-quality export and proxies
  # (engine_sync.cpp prefers libx264 over libopenh264). Same commit as
  # Fedora 44's x264-libs 0.165 (20250608gitb35605ac), the build the
  # engine was verified against.
  - name: x264
    config-opts:
      - --enable-shared
      - --enable-pic
      - --disable-cli
    sources:
      - type: git
        url: https://code.videolan.org/videolan/x264.git
        commit: b35605ace3ddf7c1a5d67a2eb553f034aef41d55

  # FFmpeg: decoders for common camera/stream formats (all native), the
  # libx264 and native AAC encoders, the mp4 muxer, and libavfilter for
  # MLT's avfilter.* services (avfilter.eq). No libavdevice: capture isn't
  # a feature and it would pull in more of the host.
  - name: ffmpeg
    config-opts:
      - --enable-gpl
      - --enable-shared
      - --disable-static
      - --enable-pic
      - --disable-programs
      - --disable-doc
      - --disable-avdevice
      - --disable-network
      - --enable-libx264
      - --enable-libdav1d
      - --enable-vaapi
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-8.1.3.tar.xz
        sha256: 7138d28c96d9d3e3af4ee3d8cad72741f8ffb40da90c1112235dea3ecd3178a3

  # MLT 7.40.0. Module choice is every service the app requests (service
  # strings in src/ matched against the modules' .yml identifiers at
  # v7.40.0), plus the loader's normalisers (src/modules/core/loader.ini):
  #   core       colour, blank, tone, luma, mix, composite, crop, mirror,
  #              null consumer, loader
  #   plus       affine filter and transition (clip transform, ADR-018)
  #   normalize  volume (clip gain, fades)
  #   avformat   media decode, avformat consumer (export, proxies),
  #              swscale/swresample normalisers, avfilter.*
  #   xml        project XML round-trip
  #   sdl2       sdl2_audio playback consumer
  #   rtaudio    fallback audio consumer
  #   gdk        pixbuf still images (loader.dict: *.png=qimage,pixbuf)
  #   resample   loader.ini's "resampler" normaliser
  # Everything else off, including frei0r (a future drop-in, ADR-014) and
  # every Qt module (ADR-007). Option names from CMakeLists.txt at v7.40.0.
  # plus's optional deps: FFTW (only its fft/dance filters) is kept out;
  # libebur128 isn't in the SDK, so plus uses its bundled copy.
  - name: mlt
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DGPL=ON
      - -DGPL3=ON
      - -DBUILD_TESTING=OFF
      - -DBUILD_TESTS_WITH_QT6=OFF
      - -DBUILD_DOCS=OFF
      - -DCLANG_FORMAT=OFF
      - -DMOD_AVFORMAT=ON
      - -DUSE_AVDEVICE=OFF
      - -DMOD_XML=ON
      - -DMOD_SDL2=ON
      - -DMOD_RTAUDIO=ON
      - -DMOD_GDK=ON
      - -DMOD_RESAMPLE=ON
      - -DMOD_QT6=OFF
      - -DMOD_GLAXNIMATE_QT6=OFF
      - -DMOD_DECKLINK=OFF
      - -DMOD_FREI0R=OFF
      - -DMOD_JACKRACK=OFF
      - -DUSE_LV2=OFF
      - -DUSE_VST2=OFF
      - -DMOD_KDENLIVE=OFF
      - -DMOD_MOVIT=OFF
      - -DMOD_NDI=OFF
      - -DMOD_NORMALIZE=ON
      - -DMOD_OLDFILM=OFF
      - -DMOD_OPENCV=OFF
      - -DMOD_OPENFX=OFF
      - -DMOD_PLUS=ON
      - -DCMAKE_DISABLE_FIND_PACKAGE_FFTW3=ON
      - -DMOD_PLUSGPL=OFF
      - -DMOD_RUBBERBAND=OFF
      - -DMOD_RNNOISE=OFF
      - -DMOD_SDL1=OFF
      - -DMOD_SOX=OFF
      - -DMOD_SPATIALAUDIO=OFF
      - -DMOD_VIDSTAB=OFF
      - -DMOD_VORBIS=OFF
      - -DMOD_XINE=OFF
    cleanup:
      - /bin
    sources:
      - type: archive
        url: https://github.com/mltframework/mlt/releases/download/v7.40.0/mlt-7.40.0.tar.gz
        sha256: f11c30e21670f62a3dfc56a31306ac02f3feea00908a2821a4a0bf3e989d3d6a

  # The app: the editor, u-studio-render (proxies and export run it as a
  # child process, found next to the editor), the GSettings schema, desktop
  # file, icon and metainfo. The tests need a display and generated media;
  # they run from a normal build, not here.
  - name: u-studio-video-editor
    buildsystem: meson
    config-opts:
      - -Dbuildtype=release
      - -Dtests=disabled
      - -Drender_tool=true
    sources:
      - type: dir
        path: ../..
        skip:
          - builddir
          - build-flatpak
          - .flatpak-builder
          - .claude
