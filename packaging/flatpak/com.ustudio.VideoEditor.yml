# Flatpak manifest for u Studio Video Editor (doc 11, "Packaging").
#
# Build the single-file bundle from the repo root with `just flatpak`.
#
# Why build MLT and FFmpeg here instead of taking them from the runtime:
# - The engine relies on MLT 7.40 behaviour (docs/developer/notes/); distros
#   such as Ubuntu 24.04 / Mint 22 ship 7.22.
# - H.264 export needs libx264, which no Flathub runtime or extension
#   carries. Linking it makes FFmpeg, and so this bundle as a whole,
#   GPL-2.0-or-later. Licence files land in /app/share/licenses.
#
# No Qt (ADR-007) is structural here: only the MLT modules listed in
# modules/mlt.yml are built, and the qt6/glaxnimate ones are switched off
# explicitly.
# FactoryPolicy's curated module directory still runs on top.
#
# There is deliberately no --share=network: the editor makes no network
# requests (CLAUDE.md, "Security & data safety").

id: com.ustudio.VideoEditor
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: u-studio-video-editor

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  # An editor opens footage from wherever it lives: home, removable
  # drives and extra mounts. Direct paths keep projects portable between
  # the Flatpak and a distro build (no /run/user/.../doc/ paths saved).
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/run/media
  - --filesystem=/mnt

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/pkgconfig
  - /share/man
  - /share/doc
  - '*.a'
  - '*.la'

modules:
  # Shared with the Flathub manifest (packaging/flathub/): each file says
  # what the module is for and how its version is tracked.
  - modules/x264.yml
  - modules/ffmpeg.yml
  - modules/mlt.yml

  # The app: the editor, u-studio-render (proxies and export run it as a
  # child process, found next to the editor), the GSettings schema, desktop
  # file, icon and metainfo. The tests need a display and generated media;
  # they run from a normal build, not here.
  - name: u-studio-video-editor
    buildsystem: meson
    config-opts:
      - -Dbuildtype=release
      - -Dtests=disabled
      - -Drender_tool=true
    sources:
      - type: dir
        path: ../..
        skip:
          - builddir
          - build-flatpak
          - .flatpak-builder
          - .claude
