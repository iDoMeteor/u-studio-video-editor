# FFmpeg: decoders for common camera/stream formats (all native), the
# libx264 and native AAC encoders, the mp4 muxer, and libavfilter for MLT's
# avfilter.* services (avfilter.eq). No libavdevice: capture isn't a feature
# and it would pull in more of the host. --enable-gpl (for x264) makes the
# bundle GPL-2.0-or-later as a whole.
#
# x-checker follows 8.x point releases only: a new major changes the
# library sonames and needs MLT's avformat module rechecked first.
name: ffmpeg
config-opts:
  - --enable-gpl
  - --enable-shared
  - --disable-static
  - --enable-pic
  - --disable-programs
  - --disable-doc
  - --disable-avdevice
  - --disable-network
  - --enable-libx264
  - --enable-libdav1d
  - --enable-vaapi
sources:
  - type: archive
    url: https://ffmpeg.org/releases/ffmpeg-8.1.3.tar.xz
    sha256: 7138d28c96d9d3e3af4ee3d8cad72741f8ffb40da90c1112235dea3ecd3178a3
    x-checker-data:
      type: html
      url: https://ffmpeg.org/releases/
      version-pattern: ffmpeg-(8\.[\d.]+)\.tar\.xz
      url-template: https://ffmpeg.org/releases/ffmpeg-$version.tar.xz
